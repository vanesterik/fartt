# Entrypoint for the project's everyday commands. Wraps uv's own commands rather
# than restating them; see CLAUDE.md for the direct uv equivalents.
#
# The repository root is the uv project, so every command runs from here as a
# plain `uv run` -- no `--directory` or `--project` needed.
version: '3'

output: prefixed

tasks:
  setup:
    desc: Install the project from its lockfile and wire up the git hooks
    cmds:
      - uv sync
      - uv run lefthook install

  check:
    desc: Run every check the gates run
    cmds:
      - task: lint
      - task: typecheck
      - task: test

  lint:
    desc: Check formatting and lint, without writing
    prefix: lint
    cmds:
      - uv run ruff format --check .
      - uv run ruff check .

  format:
    desc: Format and apply lint fixes
    prefix: format
    cmds:
      - uv run ruff format .
      - uv run ruff check . --fix

  typecheck:
    desc: Type check
    prefix: typecheck
    # The pyright wrapper checks for a newer release on every run and warns.
    # Upgrades are deliberate (dev dependency in pyproject.toml), so silence it.
    env:
      PYRIGHT_PYTHON_IGNORE_WARNINGS: '1'
    cmds:
      - uv run pyright

  test:
    desc: Run the test suite, offline
    prefix: test
    cmds:
      # pytest exits 5 when it collects nothing, which is not a failure here.
      - uv run pytest; code=$?; [ "$code" = "5" ] && exit 0 || exit "$code"

  # The integration tests (tests/integration): the server started over stdio
  # the way Claude Code starts it, on the checked-in snapshot with its clock
  # pinned and Yahoo out of reach, so they're offline and deterministic. They
  # run in parallel (pytest-xdist): nearly all of their time is starting a
  # server per test, under a second each. The unit tests stay serial; they
  # take about four seconds, less than starting the workers costs.
  test:integration:
    desc: Run the integration tests over stdio, offline on the data snapshot
    prefix: test:integration
    cmds:
      - uv run pytest -m "integration and not network" -n auto

  # The tests marked `network`, which call Yahoo Finance: the provider's live
  # tests, the one integration run of every tool from an empty folder, and the
  # integration checks of what Yahoo answers (a first download, a quote, a
  # ticker it doesn't list). A gate must not fail because Yahoo is down, so
  # `check` leaves them out; run them after a runtime dependency update.
  test:network:
    desc: Run the tests that call Yahoo Finance
    prefix: test:network
    cmds:
      - uv run pytest -m network -n auto

  # The integration tests' market data (tests/integration/snapshot/): the
  # tickers they read, downloaded as they stood at SNAPSHOT_NOW in
  # tests/integration/snapshot.py. Move that moment forward first; then
  # update the tests whose expectations are dates or values from the snapshot.
  test:snapshot:
    desc: Rebuild the integration tests' data snapshot from Yahoo Finance
    cmds:
      - uv run python -m tests.integration.snapshot

  # On-demand counterpart to Dependabot's weekly pull requests
  # (.github/dependabot.yml): direct dependencies with a newer release.
  # A release that differs only in its local version label (`+cpu`) is not
  # newer.
  outdated:
    desc: List direct dependencies that have a newer release
    silent: true
    cmds:
      - |
        outdated="$(uv tree --quiet --outdated --depth 1 | awk '
          /latest: / {
            installed = $3; latest = $NF
            sub(/^v/, "", installed); sub(/^v/, "", latest)
            sub(/\)$/, "", latest); sub(/\+.*/, "", installed); sub(/\+.*/, "", latest)
            if (installed != latest) print
          }')"
        if [ -n "$outdated" ]; then echo "$outdated"; else echo "Every direct dependency is up to date."; fi

  # The analysis session: Claude Code limited to the fartt server's tools, so an
  # analysis can't run commands, browse the web or edit files (#132). A plain
  # `claude` stays the development session. Extra arguments pass through:
  # `task analyse -- --resume`.
  #   --restricted         ignore the user, project and local settings files
  #                        (the user's `defaultMode: auto` among them)
  #   --tools ""           no built-in tools at all (Bash, Read, Edit, WebSearch, ...)
  #   --strict-mcp-config  only the servers in .mcp.json, no other connectors
  #   --settings           the profile: allow every mcp__fartt tool, ask for anything else
  #   --permission-mode    default, so nothing starts the session in auto
  # interactive: Claude Code needs the terminal, not the prefixed output above.
  analyse:
    desc: Start a Claude Code session for stock analysis, limited to the fartt server's tools
    aliases: [analyze]
    interactive: true
    cmds:
      - >-
        claude --restricted
        --tools ""
        --strict-mcp-config --mcp-config .mcp.json
        --settings .claude/analysis-settings.json
        --permission-mode default
        {{.CLI_ARGS}}

  # The operator's reset of a tripped kill switch (#146): on the cached data
  # only, it appends a reset line to the journal, after which plans are
  # accepted again and the peak starts from the value at the reset. Not
  # tripped: it writes nothing and exits 1. No MCP tool can do this, and the
  # analysis session has no shell. Reset right after a get_portfolio, so the
  # cache is current. Extra arguments pass through:
  # `task reset-kill-switch -- --note "gap on ASML"`.
  reset-kill-switch:
    desc: Reset a tripped kill switch (the operator's, never the agent's)
    cmds:
      - uv run python -m fartt.kill_switch reset {{.CLI_ARGS}}

  pre-commit:
    desc: Run the checks the git pre-commit hook runs, over staged files
    prefix: pre-commit
    cmds:
      - uv run lefthook run pre-commit
