# There is no CI, so lefthook is the gate. pre-commit only sees staged files:
# a commit that touches only pyproject.toml, uv.lock or .mcp.json runs no tests
# and no type check there. pre-push closes that gap by running the full suite
# on the whole repository before anything leaves the machine. Skip a single
# push with `git push --no-verify` when you mean to.
#
# `task check` rather than the commands it wraps, so this cannot fall behind the
# Taskfile the way a copied list would.
#
# It goes through `mise exec` when `task` is not already on PATH. lefthook runs
# its commands in `sh`, which does not get the activated environment an
# interactive shell has, so in a bare login `sh` `task` does not resolve while
# `mise` itself does. Pushing from a terminal works either way; pushing from an
# editor's git integration is where the plain call fails, with
# `task: command not found` and exit 127 in place of whatever the suite would
# have said.
#
# pytest exits with 5 when it collects no tests; that is not a failure here.
pre-push:
  commands:
    check:
      run: if command -v task >/dev/null 2>&1; then task check; else mise exec -- task check; fi

pre-commit:
  commands:
    format:
      priority: 2
      files: git ls-files
      glob: '*.py'
      run: uv run ruff format {staged_files}
      stage_fixed: true
    ruff:
      priority: 2
      files: git ls-files
      glob: '*.py'
      run: uv run ruff check {staged_files} --fix
    test:
      priority: 2
      files: git ls-files
      glob: '*.py'
      run: uv run pytest; code=$?; [ "$code" = "5" ] && exit 0 || exit "$code"
    typecheck:
      priority: 2
      files: git ls-files
      glob: '*.py'
      # Upgrades are deliberate; don't warn about newer pyright releases.
      run: PYRIGHT_PYTHON_IGNORE_WARNINGS=1 uv run pyright
